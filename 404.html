<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata | Frame Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0B1020" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Comfortaa:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-404">
  <div class="glow glow-violet" style="position:fixed;top:-15%;right:-8%" aria-hidden="true"></div>
  <div class="glow glow-cyan" style="position:fixed;bottom:-25%;left:-10%" aria-hidden="true"></div>
  <main class="notfound">
    <svg class="notfound-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <g transform="skewX(-10)">
        <path d="M58 14H32Q18 14 18 26V33" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
        <path d="M46 41H18V56" stroke="#7C3AED" stroke-width="12" stroke-linejoin="round"/>
      </g>
    </svg>
    <h1>404<span class="grad-text">.</span></h1>
    <p>Questa pagina non è ancora stata costruita.<br />Ma noi costruiamo cose: torna alla home.</p>
    <a href="index.html" class="btn btn-primary">Torna alla home</a>
  </main>
  <style>
    .page-404 { min-height: 100svh; display: grid; place-items: center; color: var(--white); }
    .notfound { text-align: center; padding: 2rem; position: relative; }
    .notfound-mark { width: 72px; height: 72px; margin-bottom: 1.5rem; filter: drop-shadow(0 0 18px rgba(124,58,237,.5)); }
    .notfound h1 { font-size: 5rem; margin-bottom: 1rem; }
    .notfound p { color: rgba(255,255,255,.7); margin-bottom: 2.2rem; }
  </style>
</body>
</html>
